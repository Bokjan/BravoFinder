name: CI

on:
  push:
    branches: [v3]
  pull_request:

jobs:
  build-and-test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-26, windows-latest]
        preset: [debug, release, tsan]
        exclude:
          # MSVC does not support -fsanitize or the GCC/Clang flags in the
          # regular presets; replace with Windows-specific presets below.
          - os: windows-latest
            preset: debug
          - os: windows-latest
            preset: release
          - os: windows-latest
            preset: tsan
        include:
          - os: windows-latest
            preset: windows-debug
          - os: windows-latest
            preset: windows-release

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v7.0.0

      # -- ccache (Linux & macOS only; skipped on Windows) ------------------
      - name: Install ccache (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get install -y ccache

      - name: Install ccache (macOS)
        if: runner.os == 'macOS'
        run: |
          export HOMEBREW_NO_REQUIRE_TAP_TRUST=1
          brew install ccache

      - name: Cache ccache (Linux)
        if: runner.os == 'Linux'
        uses: actions/cache@v6.1.0
        with:
          path: ~/.cache/ccache
          key: ccache-linux-${{ matrix.preset }}-${{ github.ref }}-${{ github.sha }}
          restore-keys: |
            ccache-linux-${{ matrix.preset }}-${{ github.ref }}-
            ccache-linux-${{ matrix.preset }}-

      - name: Cache ccache (macOS)
        if: runner.os == 'macOS'
        uses: actions/cache@v6.1.0
        with:
          path: ~/Library/Caches/ccache
          key: ccache-macos-${{ matrix.preset }}-${{ github.ref }}-${{ github.sha }}
          restore-keys: |
            ccache-macos-${{ matrix.preset }}-${{ github.ref }}-
            ccache-macos-${{ matrix.preset }}-

      # -- Configure / Build / Test ----------------------------------------
      - name: Configure
        run: >
          cmake --preset ${{ matrix.preset }}
          ${{ runner.os != 'Windows' && '-DCMAKE_CXX_COMPILER_LAUNCHER=ccache -DCMAKE_C_COMPILER_LAUNCHER=ccache' || '' }}

      - name: Build
        # Auto-detect build parallelism per runner (see release.yml for the full
        # rationale behind avoiding the preset's jobs:0 / bare -j footgun).
        shell: bash
        run: cmake --build --preset ${{ matrix.preset }} -j $(nproc 2>/dev/null || sysctl -n hw.ncpu 2>/dev/null || echo 4)

      - name: Test
        # Parallelize with the same runner-aware job count as the build step
        # (release.yml uses -j too); the ctest preset's jobs:0 otherwise resolves
        # to serial, which is especially slow for the tsan matrix leg.
        shell: bash
        run: ctest --preset ${{ matrix.preset }} -j $(nproc 2>/dev/null || sysctl -n hw.ncpu 2>/dev/null || echo 4) --timeout 300
