name: CI

on:
  push:
    branches: [v3]
  pull_request:

jobs:
  build-and-test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-13, windows-latest]
        preset: [debug, release, tsan]
        exclude:
          # MSVC does not support -fsanitize or the GCC/Clang flags in the
          # regular presets; replace with Windows-specific presets below.
          - os: windows-latest
            preset: debug
          - os: windows-latest
            preset: release
          - os: windows-latest
            preset: tsan
        include:
          - os: windows-latest
            preset: windows-debug
          - os: windows-latest
            preset: windows-release

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4.3.0

      # -- ccache (Linux & macOS only; skipped on Windows) ------------------
      - name: Install ccache (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get install -y ccache

      - name: Install ccache (macOS)
        if: runner.os == 'macOS'
        run: |
          export HOMEBREW_NO_REQUIRE_TAP_TRUST=1
          brew install ccache

      - name: Cache ccache (Linux)
        if: runner.os == 'Linux'
        uses: actions/cache@v4.3.0
        with:
          path: ~/.cache/ccache
          key: ccache-linux-${{ matrix.preset }}-${{ github.ref }}-${{ github.sha }}
          restore-keys: |
            ccache-linux-${{ matrix.preset }}-${{ github.ref }}-
            ccache-linux-${{ matrix.preset }}-

      - name: Cache ccache (macOS)
        if: runner.os == 'macOS'
        uses: actions/cache@v4.3.0
        with:
          path: ~/Library/Caches/ccache
          key: ccache-macos-${{ matrix.preset }}-${{ github.ref }}-${{ github.sha }}
          restore-keys: |
            ccache-macos-${{ matrix.preset }}-${{ github.ref }}-
            ccache-macos-${{ matrix.preset }}-

      # -- Configure / Build / Test ----------------------------------------
      - name: Configure
        run: >
          cmake --preset ${{ matrix.preset }}
          ${{ runner.os != 'Windows' && '-DCMAKE_CXX_COMPILER_LAUNCHER=ccache' || '' }}

      - name: Build
        run: cmake --build --preset ${{ matrix.preset }}

      - name: Test
        run: ctest --preset ${{ matrix.preset }} --timeout 300
